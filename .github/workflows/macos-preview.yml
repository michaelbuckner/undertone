name: macOS preview fallback
on:
  workflow_dispatch:
    inputs:
      source_ref:
        description: Exact release source commit
        required: true
        default: 2e982e204227d9f4c4415ec379fefea0be5a0f91
permissions:
  contents: read
jobs:
  universal:
    # Standard public-repository runner; no paid larger-runner label.
    runs-on: macos-15-intel
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.source_ref }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Configure macOS universal with macOS 14 minimum
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release '-DCMAKE_OSX_ARCHITECTURES=arm64;x86_64' -DCMAKE_OSX_DEPLOYMENT_TARGET=14.0
      - name: Build both architectures
        run: cmake --build build --config Release --parallel 3
      - name: Test native Intel architecture
        run: ctest --test-dir build -C Release --output-on-failure
      - name: Record ARM64 execution limitation
        run: echo 'This Intel host builds and inspects ARM64 code but cannot execute it. Apple silicon execution validation remains pending.' >> "$GITHUB_STEP_SUMMARY"
      - name: Install runtime component
        run: cmake --install build --config Release --prefix dist/Undertone --component UndertoneRuntime
      - name: Verify universal architectures and package runtime
        # Apply only the lipo argument-order correction to the tagged packager in
        # memory. The built source, clean checkout and manifest revision stay exact.
        run: |
          python - <<'PY'
          from pathlib import Path
          import sys
          script = Path('scripts/package-release.py').resolve()
          code = script.read_text()
          old = '["lipo", "-verify_arch", "arm64", "x86_64", str(binary)]'
          new = '["lipo", str(binary), "-verify_arch", "arm64", "x86_64"]'
          if old in code:
              assert code.count(old) == 1
              code = code.replace(old, new)
          else:
              assert new in code, 'Unexpected packager: review the architecture check'
          sys.argv = [str(script), '--platform', 'macOS-universal', '--stage', 'dist/Undertone', '--output', 'dist', '--juce-source', 'build/_deps/juce-src']
          exec(compile(code, str(script), 'exec'), {'__name__': '__main__', '__file__': str(script)})
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: Undertone-macOS-fallback
          path: dist/*.zip
          if-no-files-found: error
